# GitHub Pages の公開作業を始めるための仕組み。
# Claude など、アプリ経由で main に入れた変更では Pages の公開が自動で始まらないことがあるため、
# main に変更が入ったとき（または手動で実行したとき）に、公開作業（Pages のビルド）を依頼する。
name: GitHub Pages を更新する

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Pages の公開作業を依頼する
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"
