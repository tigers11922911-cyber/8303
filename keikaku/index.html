<title>計画相談 様式アプリ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* レイアウト：上に見出しと様式のタブ、下に入力欄のカード。様式の一覧（ハブ）から PDF を作る */
:root{
  --bg:#ecefe9; --card:#ffffff; --sunk:#f5f7f3; --ink:#1f2a26; --muted:#5f6d67; --line:#d3dad3;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#d9f0ec;
  --plan:#4338ca; --plan-soft:#e3e4fb; --warm:#9a5b1e; --warm-soft:#f6ead9;
  --ok:#15803d; --warn:#b45309; --bad:#b91c1c;
  --font:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121715; --card:#1a211e; --sunk:#151b18; --ink:#e4ebe7; --muted:#9aa9a2; --line:#2e3a35;
  --accent:#2dd4bf; --accent-ink:#06201c; --accent-soft:#12332e; --plan:#a5b4fc; --plan-soft:#25264a; --warm:#f0b97a; --warm-soft:#3a2a18;
  --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121715; --card:#1a211e; --sunk:#151b18; --ink:#e4ebe7; --muted:#9aa9a2; --line:#2e3a35;
  --accent:#2dd4bf; --accent-ink:#06201c; --accent-soft:#12332e; --plan:#a5b4fc; --plan-soft:#25264a; --warm:#f0b97a; --warm-soft:#3a2a18;
  --ok:#4ade80; --warn:#fbbf24; --bad:#f87171; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:500;letter-spacing:.03em;line-height:1.6;font-size:15px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
h1,h2,h3{font-weight:900;text-wrap:balance;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 260px}
.brand h1{font-size:18px;letter-spacing:.06em}
.brand small{color:var(--muted);font-size:12px}
.case-chip{display:flex;align-items:center;gap:6px;border:2px solid var(--accent);color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:4px 12px;font-weight:700;cursor:pointer;max-width:100%}
.case-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:15em}
.status{font-size:12px;color:var(--muted);white-space:nowrap}
@media (max-width:600px){.brand small{display:none}.brand h1{font-size:16px}.bar{gap:6px 10px;padding-block:8px}.case-chip span{max-width:11em}.status{flex-basis:100%;order:3}}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
nav.tabs button{flex:none;border:0;background:transparent;padding:7px 12px;border-radius:10px;font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{padding-block:16px 80px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card > header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.card h2{font-size:17px}
.card .lead{color:var(--muted);font-size:13px;margin:0}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px 14px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.wide{grid-column:1/-1}
.f label,.f .lab{font-size:13px;font-weight:700;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.f .hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],select,textarea{width:100%;border:1.5px solid var(--line);background:var(--sunk);border-radius:10px;padding:8px 10px;font-size:16px;min-width:0}
textarea{resize:vertical;line-height:1.6;min-height:64px}
input:focus,select:focus,textarea:focus{border-color:var(--accent);background:var(--card)}
.ymd{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ymd input{width:4.2em;text-align:center}
.chk{display:flex;align-items:flex-start;gap:8px;font-size:14px;cursor:pointer}
.chk input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent);flex:none}
.to{display:inline-flex;gap:3px;flex-wrap:wrap}
.to i{font-style:normal;font-size:11px;font-weight:700;border-radius:6px;padding:0 5px;background:var(--plan-soft);color:var(--plan);line-height:1.6}
.count{font-size:11.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.count.over{color:var(--warn);font-weight:700}
.btn{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.plan{background:var(--plan);border-color:var(--plan);color:var(--card)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.btn.small{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:wait}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.banner{background:var(--warm-soft);color:var(--warm);border-radius:var(--r);padding:12px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:700}
.banner p{margin:0;flex:1;min-width:12em}
/* 様式の一覧 */
.forms-group h3{font-size:14px;color:var(--muted);margin:6px 0}
.form-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.form-row:first-of-type{border-top:0}
.no{min-width:3.2em;height:2.4em;padding:0 8px;border-radius:10px;background:var(--plan-soft);color:var(--plan);font-weight:900;display:flex;align-items:center;justify-content:center;font-size:15px}
.form-row .name{font-weight:700}
.meter{height:8px;border-radius:99px;background:var(--sunk);border:1px solid var(--line);overflow:hidden;margin-top:6px;max-width:320px}
.meter b{display:block;height:100%;background:var(--accent)}
.form-row .sub{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.form-row .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.fieldlist{grid-column:1/-1;background:var(--sunk);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.fl{display:grid;grid-template-columns:minmax(8em,14em) minmax(0,1fr);gap:4px 12px;align-items:start;padding-block:6px;border-top:1px dashed var(--line)}
.fl:first-child{border-top:0}
.fl .k{font-size:12.5px;font-weight:700}
.fl .k small{display:block;color:var(--muted);font-weight:500;font-size:11px}
.fl textarea{min-height:38px;font-size:14px;padding:6px 8px}
.fl textarea.ov{border-color:var(--warm);background:var(--warm-soft)}
.fl .auto{font-size:13px;color:var(--muted);white-space:pre-wrap;word-break:break-all}
@media (max-width:640px){.form-row{grid-template-columns:auto minmax(0,1fr)}.form-row .acts{grid-column:1/-1;justify-content:flex-start}.fl{grid-template-columns:1fr}}
/* 表の入力 */
.sub-card{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--sunk)}
.sub-card > .t{font-weight:900;font-size:14px;display:flex;gap:8px;align-items:center}
.cols5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:760px){.cols5{grid-template-columns:1fr 1fr}}
@media (max-width:420px){.cols5{grid-template-columns:1fr}}
.cols5 textarea,.cols7 textarea{min-height:52px;font-size:14px;background:var(--card)}
.mini{font-size:11.5px;color:var(--muted);font-weight:700}
details.dom{border:1px solid var(--line);border-radius:12px;background:var(--card)}
details.dom > summary{cursor:pointer;padding:10px 12px;font-weight:900;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.dom > summary::after{content:"＋";color:var(--accent)}
details.dom[open] > summary::after{content:"－"}
details.dom .body{padding:0 12px 12px;display:flex;flex-direction:column;gap:12px}
.cols7{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
/* 週間 */
.blk{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:8px;align-items:center;padding-block:8px;border-top:1px solid var(--line)}
.blk:first-child{border-top:0}
.days{display:flex;gap:3px}
.days button{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);font-weight:700;cursor:pointer;font-size:13px}
.days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hours{display:flex;align-items:center;gap:4px;white-space:nowrap}
.hours select{width:auto;padding:6px}
@media (max-width:720px){.blk{grid-template-columns:1fr auto}.blk .days{grid-column:1/-1}.blk input[type=text]{grid-column:1/-1}}
.wk-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table.wk{border-collapse:collapse;font-size:11.5px;min-width:640px;width:100%}
table.wk th,table.wk td{border:1px solid var(--line);padding:2px 4px;text-align:left;vertical-align:top}
table.wk th{background:var(--sunk);font-weight:700;position:sticky;top:0}
table.wk td.h{background:var(--sunk);text-align:right;color:var(--muted);width:3.2em;font-variant-numeric:tabular-nums}
table.wk td.on{background:var(--accent-soft)}
table.wk td.cont{color:var(--muted)}
/* モーダル */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,20,16,.55);display:flex;align-items:flex-end;justify-content:center;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)}
@media (min-width:700px){.modal{align-items:center;padding:24px}}
.sheet{background:var(--card);border-radius:18px 18px 0 0;width:100%;max-width:880px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
@media (min-width:700px){.sheet{border-radius:18px}}
.sheet > header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.sheet > header h2{font-size:16px;flex:1;min-width:0}
.sheet .content{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sheet > footer{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pages{display:flex;flex-direction:column;gap:12px;align-items:center;background:var(--sunk);padding:12px;border-radius:12px}
.pages canvas{max-width:100%;height:auto;box-shadow:0 1px 6px rgba(0,0,0,.18);background:#fff}
.note{font-size:13px;color:var(--muted);margin:0}
.note.warn{color:var(--warn);font-weight:700}
.note.bad{color:var(--bad);font-weight:700}
.list{display:flex;flex-direction:column;gap:6px}
.list button.item{display:flex;justify-content:space-between;gap:8px;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;cursor:pointer}
.list button.item[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.list .item small{color:var(--muted)}
.crumb{display:flex;gap:4px;flex-wrap:wrap;font-size:13px}
.crumb button{border:0;background:transparent;color:var(--accent);font-weight:700;cursor:pointer;padding:2px 4px;text-decoration:underline}
.crumb button:last-child{text-decoration:none;color:var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.num{font-variant-numeric:tabular-nums}
</style>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand"><h1>計画相談 様式アプリ</h1><small>一度の入力で、提出課題①〜⑨と送付票・同意書・実習報告書に反映</small></div>
      <button class="case-chip" id="caseChip" type="button" aria-label="ケースを切り替える">👤 <span id="caseName">ケース</span> ▾</button>
      <span class="status" id="status">この端末に自動保存</span>
    </div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="入力の種類"></nav>
  </div>
</header>
<div class="wrap"><main id="main"></main></div>

  <div class="content" id="mBody"></div>

</div></div>

<script src="sample.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const clone = o => JSON.parse(JSON.stringify(o));
const KEIKAKU_FOLDER = { id: '1gypJAOgYIW-B-tq_N-YbeItiNq0V0NYs', name: '計画相談' };
const LS = 'keikaku_soudan_v1';
const RM = KS.reflectMap();

// ============ 保存データ ============
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
};
let S = null;
const newId = () => 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function newCase(data, sample) { return { id: newId(), data: data || {}, at: new Date().toISOString(), sample: !!sample }; }
function cur() { return S.cases.find(c => c.id === S.cur) || S.cases[0]; }
function D() { return cur().data; }
function normalize(d) {
  if (!Array.isArray(d.pri)) d.pri = [];
  while (d.pri.length < 6) d.pri.push({});
  d.pri.forEach((p, i) => { if (!p || typeof p !== 'object') d.pri[i] = {}; });
  ['supPub', 'supOth'].forEach(k => { if (!d[k] || typeof d[k] !== 'object') d[k] = {}; });
  ['wkPlan', 'wkNow'].forEach(k => { if (!Array.isArray(d[k])) d[k] = []; });
  if (!Array.isArray(d.send)) d.send = [];
  if (!d.ov || typeof d.ov !== 'object') d.ov = {};
  return d;
}
function loadLocal() {
  try { S = JSON.parse(store.get(LS) || 'null'); } catch (e) { S = null; }
  if (!S || !Array.isArray(S.cases) || !S.cases.length) {
    const c = newCase(clone(window.KS_SAMPLE), true);
    S = { cases: [c], cur: c.id, tab: 'ichiran' };
  }
  S.cases.forEach(c => normalize(c.data));
  if (!S.cases.some(c => c.id === S.cur)) S.cur = S.cases[0].id;
}
let saveTimer = null, dirty = new Set();
function touch() {
  const c = cur(); c.at = new Date().toISOString(); dirty.add(c.id);
  clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 800);
  setStatus('保存しています…');
}
function saveNow() {
  const ok = store.set(LS, JSON.stringify(S));
  if (cloud) cloudPush(); else setStatus(ok ? 'この端末に保存しました' : '⚠ この画面では端末に保存できません。「データ」から書き出してください');
}
function setStatus(t) { $('status').textContent = t; }
function caseLabel(c) { const d = c.data || {}; return [d.initial, d.caseTitle].filter(Boolean).join('　') || '名前のないケース'; }

// ---- クラウド（claude.ai の保存領域・本人だけが読める場所） ----
let cloud = null;
async function cloudInit() {
  try {
    if (!window.claude || typeof window.claude.use !== 'function') return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const uid = await user.id(); if (!uid) return;
    const col = db.collection('data/users/' + uid);
    cloud = { col };
    setStatus('保存データを確認しています…');
    const snap = await col.get();
    const remote = {};
    snap.docs.forEach(doc => { if (doc.id.startsWith('case-')) { const v = doc.data(); if (v && v.id) remote[v.id] = v; } });
    let changed = false;
    Object.values(remote).forEach(r => {
      const i = S.cases.findIndex(c => c.id === r.id);
      if (i < 0) { if (!r.deleted) { S.cases.push({ id: r.id, data: normalize(r.data || {}), at: r.at, sample: !!r.sample }); changed = true; } }
      else if ((r.at || '') > (S.cases[i].at || '')) {
        if (r.deleted) S.cases.splice(i, 1); else S.cases[i] = { id: r.id, data: normalize(r.data || {}), at: r.at, sample: !!r.sample };
        changed = true;
      }
    });
    S.cases.forEach(c => { if (!remote[c.id] || (c.at || '') > (remote[c.id].at || '')) dirty.add(c.id); });
    if (!S.cases.length) { const c = newCase(clone(window.KS_SAMPLE), true); S.cases.push(c); }
    if (!S.cases.some(c => c.id === S.cur)) S.cur = S.cases[0].id;
    if (changed) { store.set(LS, JSON.stringify(S)); renderAll(); toast('ほかの端末で保存した内容を読み込みました'); }
    cloudPush();
  } catch (e) { cloud = null; setStatus('この端末に自動保存'); }
}
let pushing = false;
async function cloudPush() {
  if (!cloud || pushing) return;
  pushing = true;
  try {
    while (dirty.size) {
      const id = [...dirty][0]; dirty.delete(id);
      const c = S.cases.find(x => x.id === id);
      const body = c ? { id: c.id, at: c.at, sample: !!c.sample, name: caseLabel(c), data: c.data } : { id, at: new Date().toISOString(), deleted: true };
      await cloud.col.doc('case-' + id).set(body);
    }
    setStatus('☁ 保存しました（ほかの端末でも開けます）');
  } catch (e) { setStatus('この端末に保存しました（クラウドには保存できませんでした）'); }
  finally { pushing = false; }
}

// ============ 値の読み書き ============
function getPath(o, path) { return path.split('.').reduce((a, k) => a == null ? undefined : a[k], o); }
function setPath(o, path, v) {
  const ks = path.split('.'); let a = o;
  ks.slice(0, -1).forEach((k, i) => { if (a[k] == null || typeof a[k] !== 'object') a[k] = /^\d+$/.test(ks[i + 1]) ? [] : {}; a = a[k]; });
  a[ks[ks.length - 1]] = v;
}

// ============ 入力欄の定義 ============
const T = (k, l, o = {}) => ({ k, l, t: 'text', ...o });
const A = (k, l, o = {}) => ({ k, l, t: 'area', rows: 3, ...o });
const SEL = (k, l, opts, o = {}) => ({ k, l, t: 'sel', opts, ...o });
const YMD = (k, l) => ({ k, l, t: 'ymd' });
const CHK = (k, l, o = {}) => ({ k, l, t: 'chk', ...o });
const OPT = {
  kubun: ['非該当', '障害支援区分 1', '障害支援区分 2', '障害支援区分 3', '障害支援区分 4', '障害支援区分 5', '障害支援区分 6', '申請中', '障害児（区分なし）'],
  handbook: ['身体障害者手帳 1級', '身体障害者手帳 2級', '身体障害者手帳 3級', '療育手帳 Ⓐ（最重度）', '療育手帳 A（重度）', '療育手帳 Ⓑ（中度）', '療育手帳 B（軽度）', '精神障害者保健福祉手帳 1級', '精神障害者保健福祉手帳 2級', '精神障害者保健福祉手帳 3級', '手帳なし'],
  copay: ['0円', '4,600円', '9,300円', '37,200円'],

function toChips(keys) {
  const set = []; keys.forEach(k => (RM[k] || []).forEach(n => { if (!set.includes(n)) set.push(n); }));
  return set.length ? `<span class="to" title="反映先の様式">${set.map(n => `<i>${esc(n)}</i>`).join('')}</span>` : '';
}
function fieldHTML(f) {
  const d = D(), id = 'in-' + f.k;
  const lab = `<label for="${id}">${esc(f.l)} ${toChips([f.k])}</label>`;
  const hint = f.hint ? `<span class="hint">${esc(f.hint)}</span>` : '';
  const v = d[f.k] == null ? '' : d[f.k];
  let inp = '';
  if (f.t === 'text') {
    const dl = f.opts ? ` list="dl-${f.k}"` : '';
    inp = `<input type="text" id="${id}" data-k="${f.k}" value="${esc(v)}"${f.ph ? ` placeholder="${esc(f.ph)}"` : ''}${dl} autocomplete="off">` + (f.opts ? `<datalist id="dl-${f.k}">${f.opts.map(o => `<option value="${esc(o)}">`).join('')}</datalist>` : '');
  } else if (f.t === 'area') {
    inp = `<textarea id="${id}" data-k="${f.k}" rows="${f.rows || 3}"${f.ph ? ` placeholder="${esc(f.ph)}"` : ''}>${esc(v)}</textarea>`;
    inp += `<div class="count" data-count="${f.k}"${f.max ? ` data-max="${f.max}"` : ''}></div>`;
  } else if (f.t === 'sel') {
    inp = `<select id="${id}" data-k="${f.k}">${f.opts.map(o => `<option value="${esc(o)}"${String(v) === o ? ' selected' : ''}>${o ? esc(o) : '（選ぶ）'}</option>`).join('')}</select>`;
  } else if (f.t === 'ymd') {
    const p = s => esc(d[f.k + s] || '');
    return `<div class="f"><span class="lab">${esc(f.l)} ${toChips([f.k + 'Y'])}</span><div class="ymd">令和<input type="text" inputmode="numeric" id="${id}Y" data-k="${f.k}Y" value="${p('Y')}" aria-label="${esc(f.l)} 年">年<input type="text" inputmode="numeric" id="${id}M" data-k="${f.k}M" value="${p('M')}" aria-label="${esc(f.l)} 月">月<input type="text" inputmode="numeric" id="${id}D" data-k="${f.k}D" value="${p('D')}" aria-label="${esc(f.l)} 日">日</div></div>`;
  } else if (f.t === 'chk') {
    return `<div class="f${f.wide ? ' wide' : ''}"><label class="chk"><input type="checkbox" id="${id}" data-k="${f.k}"${v ? ' checked' : ''}><span>${esc(f.l)} ${toChips([f.k])}</span></label>${hint}</div>`;
  }
  return `<div class="f${f.wide ? ' wide' : ''}">${lab}${inp}${hint}</div>`;
}
function sectionHTML(sec) {

}

  const res = await m.callTool('Google Drive', 'download_file_content', { fileId: f.drive });
  const b64 = b64FromPayload(res && (res.payload ?? res)) || b64FromPayload(res && res.content);
  if (!b64) throw { code: 'empty' };
  const u8 = b64ToU8(b64);

}

function fileName(f) { const d = D(); return `${f.no}_${f.name.replace(/[（）\s]/g, '').replace(/[\\/:*?"<>|]/g, '')}_${(d.initial || '').replace(/[\\/:*?"<>|.]/g, '')}.pdf`.replace(/_\.pdf$/, '.pdf'); }

async function makeOne(f, btn) {

    showPreview(f, r);
  } catch (err) {
    if (err && (err.code === 'no_mcp' || err.code === 'empty' || err.code === 'tool_error' || err.code === 'needs_reauth' || err.code === 'server_not_connected' || err.code === 'not_granted')) askUpload(f, err);
    else showModal('PDFを作れませんでした', `<p class="note bad">PDFを作る部品を読み込めませんでした。通信を確かめて、もう一度押してください。</p>`, '');

  showModal(`${f.no} ${f.name}`, `<p class="note warn">${esc(why)}</p><p class="note">手元にある「${esc(f.file)}_入力フォーム付き.pdf」を選ぶと、そのPDFに書き込みます。</p>`,
    `<button class="btn primary" type="button" id="upBtn">PDFファイルを選ぶ</button>`);

  const blob = new Blob([r.bytes], { type: 'application/pdf' }), name = fileName(f);
  preview = { blob, name };
  const warn = (r.small.length ? `<p class="note warn">文字が多いため小さくなった欄：${esc([...new Set(r.small)].slice(0, 8).join('、'))}${r.small.length > 8 ? ' ほか' : ''}</p>` : '') + (r.miss.length ? `<p class="note bad">入らなかった欄：${esc(r.miss.join('、'))}</p>` : '');
  showModal(`${f.no} ${f.name}`, `<p class="note">${r.ok}か所に書き込みました。ファイル名：${esc(name)}</p>${warn}<div class="pages" id="pages"><p class="note">プレビューを表示しています…</p></div>`,
    `<button class="btn" type="button" id="pvDl">⬇ ダウンロード</button><button class="btn primary" type="button" id="pvDrive">☁ ドライブに保存</button>`);
  $('pvDl').onclick = () => saveBlob(blob, name);

}
async function renderPages(bytes, box) {
  try {
    const lib = await pdfjs();

    box.innerHTML = '';
    for (let i = 1; i <= doc.numPages; i++) {
      const page = await doc.getPage(i), vp = page.getViewport({ scale: 1.6 });
      const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height; cv.setAttribute('aria-label', `${i}ページ目`);
      box.appendChild(cv);
      await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
    }
  } catch (err) { box.innerHTML = '<p class="note">この画面ではプレビューを表示できませんでした。ダウンロードして確かめてください。</p>'; }
}
async function buildAll(btn, label, flatten) {
  const out = [], fails = [];
  for (const [i, f] of KS.FORMS.entries()) {
    btn.textContent = `${label}（${i + 1}/${KS.FORMS.length}）`;
    try { out.push({ f, r: await build(f, { flatten }) }); } catch (err) { fails.push({ f, err }); }
  }
  return { out, fails };
}
async function mergeAll(btn) {
  const label = btn.textContent; btn.disabled = true;

    const lib = await pdfLib();

    if (!out.length) { askUpload(KS.FORMS[0], fails[0] && fails[0].err); return; }
    const merged = await lib.PDFLib.PDFDocument.create();
    for (const { r } of out) { const src = await lib.PDFLib.PDFDocument.load(r.bytes); (await merged.copyPages(src, src.getPageIndices())).forEach(p => merged.addPage(p)); }
    const bytes = await merged.save(), d = D();
    const r = { bytes, ok: out.reduce((a, x) => a + x.r.ok, 0), small: out.flatMap(x => x.r.small), miss: fails.map(x => `${x.f.no}（PDFを読み込めませんでした）`) };
    showPreview({ no: '一式', name: '提出様式（送付票〜⑨）', file: '' }, r);
    preview.name = `計画相談_提出様式一式_${(d.initial || '').replace(/[\\/:*?"<>|.]/g, '')}.pdf`;
  } catch (err) { showModal('まとめられませんでした', '<p class="note bad">PDFを作る部品を読み込めませんでした。通信を確かめて、もう一度押してください。</p>', ''); }

}
async function driveAll(btn) {

    openFolderPicker(out.map(({ f, r }) => ({ blob: new Blob([r.bytes], { type: 'application/pdf' }), name: fileName(f) })), fails.length ? `${fails.map(x => x.f.no).join('・')} はPDFを読み込めなかったので含まれていません。` : '');
  } catch (err) { showModal('作れませんでした', '<p class="note bad">PDFを作る部品を読み込めませんでした。通信を確かめて、もう一度押してください。</p>', ''); }
  finally { btn.disabled = false; btn.textContent = label; }
}

// ============ ドライブに保存（フォルダを選ぶ） ============
let fd = { stack: [], files: [] };
function driveFiles(res) {
  let out = null;
  const walk = o => {
    if (out) return;
    if (typeof o === 'string') { const t = o.trim(); if (t[0] === '{' || t[0] === '[') { try { walk(JSON.parse(t)); } catch (e) { } } return; }
    if (Array.isArray(o)) { if (o.length && o[0] && typeof o[0] === 'object' && 'id' in o[0] && ('title' in o[0] || 'name' in o[0])) { out = o; return; } o.forEach(walk); return; }
    if (o && typeof o === 'object') { if (Array.isArray(o.files)) { out = o.files; return; } Object.values(o).forEach(walk); }
  };
  walk(res && (res.payload ?? res)); if (!out) walk(res && res.content);
  return out || [];
}
function openFolderPicker(files, extra) {
  fd.files = files;
  const last = S.driveDir;
  fd.stack = [{ id: 'root', name: 'マイドライブ' }, last && last.id ? last : KEIKAKU_FOLDER];
  showModal('ドライブに保存', `<p class="note">${files.length === 1 ? esc(files[0].name) : `${files.length}個のファイル`}を保存するフォルダを選んでください。</p>${extra ? `<p class="note warn">${esc(extra)}</p>` : ''}
    <div class="crumb" id="fdCrumb"></div><div class="list" id="fdList"></div><p class="note" id="fdMsg"></p>`,
    `<button class="btn primary" type="button" id="fdHere">このフォルダに保存</button>`);
  $('fdHere').onclick = saveHere;
  fdLoad();
}
async function fdLoad() {
  const c = fd.stack[fd.stack.length - 1];
  $('fdCrumb').innerHTML = fd.stack.map((x, i) => `<button type="button" data-fdi="${i}">${esc(x.name)}</button>`).join('<span aria-hidden="true">›</span>');
  $('fdList').innerHTML = '<p class="note">フォルダを読み込んでいます…</p>'; $('fdMsg').textContent = '';
  try {
    const m = await mcp(); if (!m) throw { code: 'no_mcp' };
    const res = await m.callTool('Google Drive', 'search_files', { query: `parentId = '${c.id}' and mimeType = 'application/vnd.google-apps.folder' and trashed = false`, pageSize: 100, excludeContentSnippets: true });
    const fs = driveFiles(res).map(f => ({ id: f.id, name: f.title || f.name })).sort((a, b) => a.name.localeCompare(b.name, 'ja'));
    $('fdList').innerHTML = fs.length ? fs.map(f => `<button type="button" class="item" data-fdgo="${esc(f.id)}" data-fdname="${esc(f.name)}"><span>📁 ${esc(f.name)}</span><small>開く ›</small></button>`).join('') : '<p class="note">この中にフォルダはありません。ここに保存できます。</p>';
  } catch (err) {
    $('fdList').innerHTML = '';
    $('fdMsg').textContent = err && err.code === 'no_mcp' ? 'この画面ではGoogleドライブを使えません。「ダウンロード」で保存してください。' : driveErr(err);
  }
}
$('mBody').addEventListener('click', e => {
  const go = e.target.closest('[data-fdgo]'), cr = e.target.closest('[data-fdi]');
  if (go) { fd.stack.push({ id: go.dataset.fdgo, name: go.dataset.fdname }); fdLoad(); }
  else if (cr) { fd.stack = fd.stack.slice(0, Number(cr.dataset.fdi) + 1); fdLoad(); }
});
async function saveHere() {
  const c = fd.stack[fd.stack.length - 1], btn = $('fdHere');
  btn.disabled = true;
  let done = 0; const failed = [];
  try {
    const m = await mcp(); if (!m) throw { code: 'no_mcp' };
    for (const f of fd.files) {
      btn.textContent = fd.files.length > 1 ? `保存中（${done + 1}/${fd.files.length}）` : '保存中…';
      try {
        const u8 = new Uint8Array(await f.blob.arrayBuffer());
        const args = { title: f.name, base64Content: u8ToB64(u8), contentMimeType: f.blob.type || 'application/pdf', disableConversionToGoogleType: true };
        if (c.id !== 'root') args.parentId = c.id;
        const res = await m.callTool('Google Drive', 'create_file', args);
        if (res && (res.isError || res.error)) throw res.error || { code: 'save' };
        done++;
      } catch (err) { failed.push(f.name); if (err && (err.code === 'needs_reauth' || err.code === 'server_not_connected' || err.code === 'not_granted')) throw err; }
    }
    S.driveDir = c.id === 'root' ? null : { id: c.id, name: c.name }; store.set(LS, JSON.stringify(S));
    hideModal();
    toast(failed.length ? `${done}個を保存しました（${failed.length}個は保存できませんでした）` : `ドライブの「${c.name}」に${done}個保存しました`);
  } catch (err) {
    $('fdMsg').textContent = err && err.code === 'no_mcp' ? 'この画面ではGoogleドライブを使えません。「ダウンロード」で保存してください。' : driveErr(err).replace('読み込めませんでした', '保存できませんでした');
  } finally { if (document.body.contains(btn)) { btn.disabled = false; btn.textContent = 'このフォルダに保存'; } }
}

// ============ 共通の部品 ============
function showModal(title, body, foot) {
  $('mTitle').textContent = title; $('mBody').innerHTML = body; $('mFoot').innerHTML = foot || '';
  $('modal').hidden = false; $('mClose').focus();
}
function hideModal() { $('modal').hidden = true; $('mBody').innerHTML = ''; if (modalResolve) { modalResolve(false); modalResolve = null; } }
$('mClose').addEventListener('click', hideModal);
$('modal').addEventListener('click', e => { if (e.target.id === 'modal') hideModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('modal').hidden) hideModal(); });
let modalResolve = null;
function askConfirm(text, yes, danger) {
  return new Promise(res => {
    showModal('確認', `<p style="white-space:pre-wrap;margin:0">${esc(text)}</p>`, `<button class="btn" type="button" id="cNo">やめる</button><button class="btn ${danger ? '' : 'primary'}" type="button" id="cYes" style="${danger ? 'color:var(--bad);border-color:var(--bad)' : ''}">${esc(yes)}</button>`);
    modalResolve = res;
    $('cNo').onclick = () => hideModal();
    $('cYes').onclick = () => { modalResolve = null; hideModal(); res(true); };
  });
}
let toastTimer = null;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.style.opacity = 1; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.opacity = 0; }, 2800); }
async function saveBlob(blob, name) {
  try {
    const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
    if (dl) { await dl.save({ filename: name, data: blob }); toast(`保存しました：${name}`); return; }
  } catch (e) { if (e && e.code === 'declined') { toast('ダウンロードをやめました'); return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
